[project]
name = "qa-system-on-medical-kg"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neo4j>=6,<7",
    "openai>=2,<3",
    "py2neo==2021.2.4",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

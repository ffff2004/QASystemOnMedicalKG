<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>医学知识图谱问答</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-name">医学图谱问答</span>
      <button class="icon" id="theme" type="button" aria-label="切换主题">
        <svg class="theme-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 7.5 7.5A5.8 5.8 0 0 1 10 2.5Z" fill="currentColor"/></svg>
        <svg class="theme-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M3.9 3.9l1.4 1.4M14.7 14.7l1.4 1.4M16.1 3.9l-1.4 1.4M5.3 14.7l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="create">
      <button class="primary" id="new" type="button"><span class="plus" aria-hidden="true">+</span>新建对话</button>
    </div>

    <nav class="history" id="history" aria-label="历史对话"></nav>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <button class="icon menu" id="menu" type="button" aria-label="历史对话">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="heading">
        <h1 id="title">新对话</h1>
        <p id="meta"></p>
      </div>
    </header>

    <section class="thread" id="thread" aria-live="polite">
      <div class="thread-inner" id="thread-inner"></div>
    </section>

    <div class="composer-area">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="输入问题，例如：乳腺癌的症状有哪些？" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="发送">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="notice">演示用途，不用于诊断；请勿输入患者个人信息。</p>
    </div>
  </main>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
